services:
  dacem_sync_ewp_ounits.event_subscriber:
    class: Drupal\dacem_sync_ewp_ounits\EventSubscriber\ContentChangedEventSubscriber
    arguments: ['@logger.factory', '@queue']
    tags:
      - { name: event_subscriber }
  dacem_sync_ewp_ounits.ounit_sync_handler:
    class: Drupal\dacem_sync_ewp_ounits\SyncHandler\OunitSyncHandler
    arguments: ['dacem_sync.entity_builder', 'dacem_sync.entity_manager', '@dacem_sync_ewp_ounits.ounit_field_mapping', '@logger.factory']
    tags:
      - { name: 'sync_handler', id: 'ounit_sync_handler' }
  dacem_sync_ewp_ounits.ounit_field_mapping:
    class: Drupal\dacem_sync_ewp_ounits\FieldMapping\OunitFieldMapping
